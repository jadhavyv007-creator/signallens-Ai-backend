[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signallens-ai"
version = "3.0.0"
description = "SignalLens AI - FastAPI Backend & DSP Workbench"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["api*", "signalens*"]

[tool.vercel]
entrypoint = "main:app"


